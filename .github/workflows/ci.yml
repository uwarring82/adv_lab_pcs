name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }  # also installs seabreeze (Windows-only requirement)
    defaults:
      run:
        working-directory: spectro-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: spectro-dashboard/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        # `|| exit 1`, not `&&`: bash -e ignores failures before an &&, so a later
        # good file would otherwise hide an earlier broken one.
        run: |
          for f in spectro-dashboard/web/*.js; do
            node --check "$f" || exit 1
            echo "OK  $f"
          done

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse all scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              foreach ($e in $errors) { Write-Host "::error file=$($e.Extent.File),line=$($e.Extent.StartLineNumber)::$($e.Message)" }
            }
            else { Write-Host "OK  $($_.FullName)" }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer (errors fail the job)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse
          $issues | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }

  windows-exe:
    needs: [tests, powershell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SpectrometerDashboard.exe
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File spectro-dashboard\packaging\build_exe.ps1
      - name: Smoke-test the executable (simulator)
        shell: powershell
        run: |
          $exe = 'spectro-dashboard\dist\SpectrometerDashboard.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--sim', '--no-browser', '--port', '8777' -PassThru
          try {
            $status = $null
            for ($i = 0; $i -lt 60 -and -not $status; $i++) {
              Start-Sleep -Seconds 1
              try { $status = Invoke-RestMethod http://127.0.0.1:8777/api/status } catch { }
            }
            if (-not $status) { throw 'The executable did not answer within 60 s.' }
            if (-not $status.info.simulated) { throw 'Expected the simulator backend.' }
            $page = Invoke-WebRequest http://127.0.0.1:8777/ -UseBasicParsing
            if ($page.Content -notmatch 'Spectrometer Dashboard') { throw 'Dashboard page not served.' }
            foreach ($asset in 'app.js', 'spectrum_color.js', 'lib/uPlot.iife.min.js') {
              Invoke-WebRequest "http://127.0.0.1:8777/$asset" -UseBasicParsing | Out-Null
            }
            $s = Invoke-RestMethod http://127.0.0.1:8777/api/spectrum
            if ($s.intensities.Count -ne $s.wavelengths.Count) { throw 'Spectrum lengths differ.' }
            $m = Invoke-RestMethod http://127.0.0.1:8777/api/measurement -Method Post -ContentType 'application/json' -Body '{"num_scans": 3}'
            if ($m.num_scans -ne 3) { throw 'Measurement failed.' }
            Write-Host "OK: $($status.info.model), $($s.intensities.Count) channels, web assets and measurement served."
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Smoke-test the hardware path (no spectrometer on the runner)
        shell: powershell
        run: |
          # Without --sim the executable must load seabreeze's compiled backend and
          # query Windows for USB devices, then fall back because none is attached.
          $exe = 'spectro-dashboard\dist\SpectrometerDashboard.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--no-browser', '--port', '8778' -PassThru
          try {
            $d = $null
            for ($i = 0; $i -lt 60 -and -not $d; $i++) {
              Start-Sleep -Seconds 1
              try { $d = Invoke-RestMethod http://127.0.0.1:8778/api/diagnostics -TimeoutSec 60 } catch { }
            }
            if (-not $d) { throw 'The executable did not answer within 60 s.' }
            $d | ConvertTo-Json -Depth 6 | Write-Host
            if ($d.spectrometer.forced_simulator) { throw 'Unexpected forced simulator.' }
            if ($d.seabreeze.error) { throw "seabreeze failed in the executable: $($d.seabreeze.error)" }
            if ($d.seabreeze.backend -ne 'cseabreeze') { throw "Expected the cseabreeze backend, got '$($d.seabreeze.backend)'." }
            if ($null -eq $d.usb_devices -or $d.usb_devices.error) { throw "USB query failed: $($d.usb_devices.error)" }
            if ($d.spectrometer.fallback_reason -notmatch 'No Ocean Optics spectrometer found') {
              throw "Unexpected fallback reason: $($d.spectrometer.fallback_reason)"
            }
            Write-Host 'OK: hardware backend loads in the executable; no device attached, as expected.'
          }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            spectro-dashboard/dist/SpectrometerDashboard.exe
            spectro-dashboard/dist/LICENSE.txt
            spectro-dashboard/dist/THIRD_PARTY_NOTICES.md
            spectro-dashboard/dist/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error

  # Pushing a version tag (v1.2.3) publishes the smoke-tested executable as a
  # GitHub pre-release, downloadable without an account (artifacts need a login).
  # Promote it to a full release after checking it with a real spectrometer.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the app version
        run: |
          app=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' spectro-dashboard/spectro/__init__.py)
          if [ "v$app" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ = $app"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: artifact
      - name: Package and publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="SpectrometerDashboard-${version}-windows"
          mv artifact "$dir"
          zip -r -X "$dir.zip" "$dir"
          sha256sum "$dir.zip" > SHA256SUMS.txt
          {
            cat .github/release-notes.md
            echo
            echo "SHA-256 of the ZIP: \`$(cut -d' ' -f1 SHA256SUMS.txt)\`"
            echo
            echo "Built and smoke-tested by CI from commit ${GITHUB_SHA::7} ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}))."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "$dir.zip" SHA256SUMS.txt \
            --title "$version" --notes-file notes.md --prerelease --verify-tag
